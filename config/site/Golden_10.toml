# Site: PVDAQ System 10 - [10] NREL CIS -1
# Dataset: PVDAQ (OEDI), system_id = 10; written by scripts/pvdaq_site_configs.py, edit there
# Measured: data/validation/PVDAQ/10/10_hourly.parquet (pvdaq_extract.py; see 10_report.md)
# DC rating 1.12 kW: System.power (no module wattage)
# Module: Shell 'Eclipse 80' = two ST40 CIS laminates; 28 x ST40 = 1.12 kW = System.power (SANDIA Shell_Solar_ST40__1999__E__)
# Inverter: unknown x 1, no AC cap (rating unknown)
# Weather: MIDC BMS; inputs "midc", met "midc"
# Scoring year 2021: most scorable daylight hours of the years the weather source covers (98.9 % of daylight hours)

[location]
name     = "PVDAQ 10 - [10] NREL CIS -1"
lat      = 39.7404
lon      = -105.1774
altitude = 1792.8        # m, metadata

[data]
start_date = "2021-01-01"
end_date   = "2021-12-31"
resolution = "hourly"
sa_start   = "2021-01-01"
sa_end     = "2021-12-31"

[array]
tracking = false
tilt     = 40.0        # metadata
azimuth  = 180.0       # metadata, degrees from north
albedo   = 0.20        # assumed

[system]
rated_capacity_kw = 1.12
pdc0_w            = 1120.0   # DC rating above (28 x 40.0 W = 1.12 kW from the module table)
ns_arr            = 28           # assumed (no string data; ~400 V target; only Ns x Np = 28 matters without an inverter model)
np_arr            = 1

[station]
midc = "BMS"

[measured]
file               = "data/validation/PVDAQ/10/10_hourly.parquet"
source             = "pvdaq_10"
time_col           = "timestamp"
power_col          = "pv_power_hourly_kW"
power_unit         = "kW"
tz                 = "Etc/GMT+7"      # fixed standard time: pvdaq_extract.py moved the labels onto it, per month
timestamp_label    = "start"
interval_minutes   = 60
manual_shift_hours = 0
auto_lag_correction = false     # already corrected in the parquet (0 h in every year, pvdaq_verify_parquet.py)
max_lag_hours      = 4

[module]
# Shell_Solar_ST40__1999__E__ (CIS); values from the SANDIA table
isc_ref    = 2.5900
voc_ref    = 22.2000
imp_ref    = 2.4100
vmp_ref    = 16.6000
mu_isc     = -0.000026   # A/K
mu_voc     = -0.091000   # V/K
ns         = 42
alpha_p    = -0.004908   # 1/K (Sandia Aimp + Bvmpo/Vmpo)
eta_mp_stc = 0.0944
huld_cell_type = "cis"   # Huld coefficients; from the module table

[iam]
n = 1.526
k = 4.0
l = 0.002

[thermal.homer]
tc_noct   = 45.0      # Sandia has no NOCT: 45 assumed
ta_noct   = 20.0
poa_noct  = 0.8
tau_alpha = 0.9

[thermal.pvsyst]
u_c        = 29.0     # free-standing rack or carport (PVsyst 'free mounted'); mounting assumed from the system name and tilt
u_v        = 0.0
eta_module = 0.0944
alpha_abs  = 0.9

[losses]
n_degradation = 0.9254   # (1 - 0.005)^15.5 years: installed 2006-01-09 (earliest of metadata and first data), mid-2021
n_temp      = 0.95   # HOMER model only
n_soiling   = 0.98
n_mismatch  = 0.98
n_dc_wiring = 0.98
n_ac_wiring = 0.99
n_inverter  = 0.97
f_pv        = 0.95
eta_inv     = 0.97

# ── Provenance: source class of every model parameter (scripts/site_provenance.py) ──
# measured | datasheet | published | metadata | output | assumed (solarmodel/schema.py)
[provenance]
"location.lat"              = "metadata"
"location.lon"              = "metadata"
"location.altitude"         = "metadata"
"array.tracking"            = "metadata"
"array.tilt"                = "metadata"
"array.azimuth"             = "metadata"
"array.albedo"              = "assumed"
"system.rated_capacity_kw"  = "metadata"
"system.pdc0_w"             = "metadata"
"system.ns_arr"             = "assumed"
"system.np_arr"             = "assumed"
"module.isc_ref"            = "datasheet"
"module.voc_ref"            = "datasheet"
"module.imp_ref"            = "datasheet"
"module.vmp_ref"            = "datasheet"
"module.mu_isc"             = "datasheet"
"module.mu_voc"             = "datasheet"
"module.ns"                 = "datasheet"
"module.alpha_p"            = "datasheet"
"module.eta_mp_stc"         = "datasheet"
"module.huld_cell_type"     = "datasheet"
"iam.n"                     = "published"
"iam.k"                     = "published"
"iam.l"                     = "published"
"thermal.homer.tc_noct"     = "assumed"
"thermal.homer.ta_noct"     = "published"
"thermal.homer.poa_noct"    = "published"
"thermal.homer.tau_alpha"   = "published"
"thermal.pvsyst.u_c"        = "published"
"thermal.pvsyst.u_v"        = "published"
"thermal.pvsyst.eta_module" = "datasheet"
"thermal.pvsyst.alpha_abs"  = "published"
"losses.n_degradation"      = "published"
"losses.n_temp"             = "assumed"
"losses.n_soiling"          = "assumed"
"losses.n_mismatch"         = "assumed"
"losses.n_dc_wiring"        = "assumed"
"losses.n_ac_wiring"        = "assumed"
"losses.n_inverter"         = "assumed"
"losses.f_pv"               = "assumed"
"losses.eta_inv"            = "assumed"
