# Site: PVDAQ System 1418 - [1418] Clark County-NV - Desert Breeze
# Dataset: PVDAQ (OEDI), system_id = 1418; written by scripts/pvdaq_site_configs.py, edit there
# Measured: data/validation/PVDAQ/1418/1418_hourly.parquet (pvdaq_extract.py; see 1418_report.md)
# DC rating 43.68 kW: module count x model-name wattage (System.power says 42.0 kW)
# Module: metadata 'sw280 mono' (CEC SolarWorld_Americas_Inc_Sunmodule_Plus_SWA_280_mono)
# Inverter: Solectria PVI 14TL x 3, AC cap 42.0 kW
# Weather: MIDC UNLV; inputs "midc", met "midc"
# Scoring year 2016: most scorable daylight hours of the years the weather source covers (92.5 % of daylight hours)

[location]
name     = "PVDAQ 1418 - [1418] Clark County-NV - Desert Breeze"
lat      = 36.1253
lon      = -115.2713
altitude = 779.0        # m, metadata

[data]
start_date = "2016-01-01"
end_date   = "2016-12-31"
resolution = "hourly"
sa_start   = "2016-01-01"
sa_end     = "2016-12-31"

[array]
tracking = false
tilt     = 10.0        # metadata
azimuth  = 138.0       # metadata, degrees from north
albedo   = 0.20        # assumed

[system]
rated_capacity_kw = 43.68
pdc0_w            = 43680.0   # DC rating above (156 x 283.0 W = 44.15 kW from the module table)
ac_cap_kw         = 42.0       # inverter nameplate x count
ns_arr            = 13           # assumed (no string data; ~400 V target; only Ns x Np = 156 matters without an inverter model)
np_arr            = 12

[station]
midc = "UNLV"

[measured]
file               = "data/validation/PVDAQ/1418/1418_hourly.parquet"
source             = "pvdaq_1418"
time_col           = "timestamp"
power_col          = "pv_power_hourly_kW"
power_unit         = "kW"
tz                 = "Etc/GMT+8"      # fixed standard time: pvdaq_extract.py moved the labels onto it, per month
timestamp_label    = "start"
interval_minutes   = 60
manual_shift_hours = 0
auto_lag_correction = false     # already corrected in the parquet (0 h in every year, pvdaq_verify_parquet.py)
max_lag_hours      = 4

[module]
# SolarWorld_Americas_Inc_Sunmodule_Plus_SWA_280_mono (Mono-c-Si); values from the CEC table
isc_ref    = 9.7100
voc_ref    = 39.5000
imp_ref    = 9.0700
vmp_ref    = 31.2000
mu_isc     = 0.002913   # A/K
mu_voc     = -0.118500   # V/K
ns         = 60
alpha_p    = -0.004200   # 1/K
eta_mp_stc = 0.1747
cec        = "SolarWorld_Americas_Inc_Sunmodule_Plus_SWA_280_mono"

[iam]
n = 1.526
k = 4.0
l = 0.002

[thermal.homer]
tc_noct   = 46.3
ta_noct   = 20.0
poa_noct  = 0.8
tau_alpha = 0.9

[thermal.pvsyst]
u_c        = 20.0     # low-tilt rack on a roof (PVsyst 'semi-integrated with air duct'); mounting assumed from the system name and tilt
u_v        = 0.0
eta_module = 0.1747
alpha_abs  = 0.9

[losses]
n_degradation = 0.9949   # (1 - 0.005)^1.0 years: installed 2015-06-23 (earliest of metadata and first data), mid-2016
n_temp      = 0.95   # HOMER model only
n_soiling   = 0.98
n_mismatch  = 0.98
n_dc_wiring = 0.98
n_ac_wiring = 0.99
n_inverter  = 0.97
f_pv        = 0.95
eta_inv     = 0.97

# ── Provenance: source class of every model parameter (scripts/site_provenance.py) ──
# measured | datasheet | published | metadata | output | assumed (solarmodel/schema.py)
[provenance]
"location.lat"              = "metadata"
"location.lon"              = "metadata"
"location.altitude"         = "metadata"
"array.tracking"            = "metadata"
"array.tilt"                = "metadata"
"array.azimuth"             = "metadata"
"array.albedo"              = "assumed"
"system.rated_capacity_kw"  = "metadata"
"system.pdc0_w"             = "metadata"
"system.ac_cap_kw"          = "metadata"
"system.ns_arr"             = "assumed"
"system.np_arr"             = "assumed"
"module.isc_ref"            = "datasheet"
