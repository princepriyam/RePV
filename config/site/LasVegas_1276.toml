# Site: PVDAQ System 1276 - [1276] Andre Agassi Preparatory Academy - Building B
# Dataset: PVDAQ (OEDI), system_id = 1276; written by scripts/pvdaq_site_configs.py, edit there
# Measured: data/validation/PVDAQ/1276/1276_hourly.parquet (pvdaq_extract.py; see 1276_report.md)
# DC rating 60.48 kW: module count x model-name wattage (System.power says 68.48 kW)
# Module: metadata 'nu-u240f1' (CEC Sharp_NU_U240F1)
# Inverter: unknown 50 kW x 1, AC cap 50.0 kW
# Weather: MIDC UNLV; inputs "midc", met "midc"
# Scoring year 2016: most scorable daylight hours of the years the weather source covers (100.0 % of daylight hours)

[location]
name     = "PVDAQ 1276 - [1276] Andre Agassi Preparatory Academy - Building B"
lat      = 36.1952
lon      = -115.1582
altitude = 620.0        # m, metadata

[data]
start_date = "2016-01-01"
end_date   = "2016-12-31"
resolution = "hourly"
sa_start   = "2016-01-01"
sa_end     = "2016-12-31"

[array]
tracking = false
tilt     = 5.0        # metadata
azimuth  = 180.0       # metadata, degrees from north
albedo   = 0.20        # assumed

[system]
rated_capacity_kw = 60.48
pdc0_w            = 60480.0   # DC rating above (252 x 240.2 W = 60.53 kW from the module table)
ac_cap_kw         = 50.0       # inverter nameplate x count
ns_arr            = 12           # assumed (no string data; ~400 V target; only Ns x Np = 252 matters without an inverter model)
np_arr            = 21

[station]
midc = "UNLV"

[measured]
file               = "data/validation/PVDAQ/1276/1276_hourly.parquet"
source             = "pvdaq_1276"
time_col           = "timestamp"
power_col          = "pv_power_hourly_kW"
power_unit         = "kW"
tz                 = "Etc/GMT+8"      # fixed standard time: pvdaq_extract.py moved the labels onto it, per month
timestamp_label    = "start"
interval_minutes   = 60
manual_shift_hours = 0
auto_lag_correction = false     # already corrected in the parquet (0 h in every year, pvdaq_verify_parquet.py)
max_lag_hours      = 4

[module]
# Sharp_NU_U240F1 (Mono-c-Si); values from the CEC table
isc_ref    = 8.6500
voc_ref    = 37.4000
imp_ref    = 7.9800
vmp_ref    = 30.1000
mu_isc     = 0.003806   # A/K
mu_voc     = -0.123046   # V/K
ns         = 60
alpha_p    = -0.004580   # 1/K
eta_mp_stc = 0.1474
cec        = "Sharp_NU_U240F1"

[iam]
n = 1.526
k = 4.0
l = 0.002

[thermal.homer]
tc_noct   = 45.4
ta_noct   = 20.0
poa_noct  = 0.8
tau_alpha = 0.9

[thermal.pvsyst]
u_c        = 20.0     # low-tilt rack on a roof (PVsyst 'semi-integrated with air duct'); mounting assumed from the system name and tilt
u_v        = 0.0
eta_module = 0.1474
alpha_abs  = 0.9

[losses]
n_degradation = 0.9761   # (1 - 0.005)^4.8 years: installed 2011-08-30 (earliest of metadata and first data), mid-2016
n_temp      = 0.95   # HOMER model only
n_soiling   = 0.98
n_mismatch  = 0.98
n_dc_wiring = 0.98
n_ac_wiring = 0.99
n_inverter  = 0.97
f_pv        = 0.95
eta_inv     = 0.97

# ── Provenance: source class of every model parameter (scripts/site_provenance.py) ──
