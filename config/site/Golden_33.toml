# Site: PVDAQ System 33 - Silicor Materials
# Dataset: PVDAQ (OEDI), system_id = 33; written by scripts/pvdaq_site_configs.py, edit there
# Measured: data/validation/PVDAQ/33/33_hourly.parquet (pvdaq_extract.py; see 33_report.md)
# DC rating 2.4 kW: System.power (no module wattage)
# Module: PROXY: Silicor UMG-Si 240 W module has no public datasheet; a 60-cell 240 W poly module stands in; 10 x 240 W = 2.4 kW = System.power (CEC SolarWorld_Industries_GmbH_Sunmodule_Plus_SW_240_poly)
# Inverter: SMA SB3000US x 1, AC cap 3.0 kW
# Weather: MIDC BMS; inputs "midc", met "midc"
# Scoring year 2022: most scorable daylight hours of the years the weather source covers (99.3 % of daylight hours)

[location]
name     = "PVDAQ 33 - Silicor Materials"
lat      = 39.7404
lon      = -105.1772
altitude = 1794.0        # m, metadata

[data]
start_date = "2022-01-01"
end_date   = "2022-12-31"
resolution = "hourly"
sa_start   = "2022-01-01"
sa_end     = "2022-12-31"

[array]
tracking = false
tilt     = 40.0        # metadata
azimuth  = 180.0       # metadata, degrees from north
albedo   = 0.20        # assumed

[system]
rated_capacity_kw = 2.4
pdc0_w            = 2400.0   # DC rating above (10 x 240.4 W = 2.40 kW from the module table)
ac_cap_kw         = 3.0       # inverter nameplate x count
ns_arr            = 10           # assumed (no string data; ~400 V target; only Ns x Np = 10 matters without an inverter model)
np_arr            = 1

[station]
midc = "BMS"

[measured]
file               = "data/validation/PVDAQ/33/33_hourly.parquet"
source             = "pvdaq_33"
time_col           = "timestamp"
power_col          = "pv_power_hourly_kW"
power_unit         = "kW"
tz                 = "Etc/GMT+7"      # fixed standard time: pvdaq_extract.py moved the labels onto it, per month
timestamp_label    = "start"
interval_minutes   = 60
manual_shift_hours = 0
auto_lag_correction = false     # already corrected in the parquet (0 h in every year, pvdaq_verify_parquet.py)
max_lag_hours      = 4

[module]
# SolarWorld_Industries_GmbH_Sunmodule_Plus_SW_240_poly (Multi-c-Si); values from the CEC table
isc_ref    = 8.4400
voc_ref    = 37.2000
imp_ref    = 7.9600
vmp_ref    = 30.2000
mu_isc     = 0.006668   # A/K
mu_voc     = -0.131688   # V/K
ns         = 60
alpha_p    = -0.004560   # 1/K
eta_mp_stc = 0.1493
cec        = "SolarWorld_Industries_GmbH_Sunmodule_Plus_SW_240_poly"

[iam]
n = 1.526
k = 4.0
l = 0.002

[thermal.homer]
tc_noct   = 47.2
ta_noct   = 20.0
poa_noct  = 0.8
tau_alpha = 0.9

[thermal.pvsyst]
u_c        = 29.0     # free-standing rack or carport (PVsyst 'free mounted'); mounting assumed from the system name and tilt
u_v        = 0.0
eta_module = 0.1493
alpha_abs  = 0.9

[losses]
n_degradation = 0.9394   # (1 - 0.005)^12.5 years: installed 2010-01-08 (earliest of metadata and first data), mid-2022
n_temp      = 0.95   # HOMER model only
n_soiling   = 0.98
n_mismatch  = 0.98
n_dc_wiring = 0.98
n_ac_wiring = 0.99
n_inverter  = 0.97
f_pv        = 0.95
eta_inv     = 0.97

# ── Provenance: source class of every model parameter (scripts/site_provenance.py) ──
# measured | datasheet | published | metadata | output | assumed (solarmodel/schema.py)
[provenance]
"location.lat"              = "metadata"
"location.lon"              = "metadata"
"location.altitude"         = "metadata"
"array.tracking"            = "metadata"
"array.tilt"                = "metadata"
"array.azimuth"             = "metadata"
"array.albedo"              = "assumed"
"system.rated_capacity_kw"  = "metadata"
"system.pdc0_w"             = "metadata"
"system.ac_cap_kw"          = "metadata"
"system.ns_arr"             = "assumed"
"system.np_arr"             = "assumed"
"module.isc_ref"            = "datasheet"
"module.voc_ref"            = "datasheet"
"module.imp_ref"            = "datasheet"
"module.vmp_ref"            = "datasheet"
"module.mu_isc"             = "datasheet"
"module.mu_voc"             = "datasheet"
"module.ns"                 = "datasheet"
"module.alpha_p"            = "datasheet"
"module.eta_mp_stc"         = "datasheet"
"module.cec"                = "datasheet"
"iam.n"                     = "published"
"iam.k"                     = "published"
"iam.l"                     = "published"
"thermal.homer.tc_noct"     = "datasheet"
"thermal.homer.ta_noct"     = "published"
"thermal.homer.poa_noct"    = "published"
"thermal.homer.tau_alpha"   = "published"
"thermal.pvsyst.u_c"        = "published"
"thermal.pvsyst.u_v"        = "published"
"thermal.pvsyst.eta_module" = "datasheet"
"thermal.pvsyst.alpha_abs"  = "published"
"losses.n_degradation"      = "published"
"losses.n_temp"             = "assumed"
"losses.n_soiling"          = "assumed"
"losses.n_mismatch"         = "assumed"
"losses.n_dc_wiring"        = "assumed"
"losses.n_ac_wiring"        = "assumed"
"losses.n_inverter"         = "assumed"
"losses.f_pv"               = "assumed"
"losses.eta_inv"            = "assumed"
