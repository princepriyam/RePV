# Site: PVDAQ System 1231 - [1231] FSEC - Zero Energy House - New Smyrna Beach
# Dataset: PVDAQ (OEDI), system_id = 1231; written by scripts/pvdaq_site_configs.py, edit there
# Measured: data/validation/PVDAQ/1231/1231_hourly.parquet (pvdaq_extract.py; see 1231_report.md)
# DC rating 3.36 kW: module count x model-name wattage
# Module: PROXY: metadata 'PVL-120' is not in the tables; PVL-124 (same a-Si laminate family) stands in, pdc0 = 28 x 120 W (SANDIA Uni_Solar_PVL_124__2006__E__)
# Inverter: Trace SW4048 (battery inverter) x 1, no AC cap (rating unknown)
# Weather: NSRDB PSM v4 at the site; inputs "nsrdb", met "point"
# Scoring year 2003: most scorable daylight hours of the years the weather source covers (99.3 % of daylight hours)

[location]
name     = "PVDAQ 1231 - [1231] FSEC - Zero Energy House - New Smyrna Beach"
lat      = 29.0258
lon      = -80.9274
altitude = 2.0        # m, metadata

[data]
start_date = "2003-01-01"
end_date   = "2003-12-31"
resolution = "hourly"
sa_start   = "2003-01-01"
sa_end     = "2003-12-31"

[array]
tracking = false
tilt     = 20.0        # metadata
azimuth  = 270.0       # metadata, degrees from north
albedo   = 0.20        # assumed

[system]
rated_capacity_kw = 3.36
pdc0_w            = 3360.0   # DC rating above (28 x 123.0 W = 3.44 kW from the module table)
ns_arr            = 14           # assumed (no string data; ~400 V target; only Ns x Np = 28 matters without an inverter model)
np_arr            = 2

[measured]
file               = "data/validation/PVDAQ/1231/1231_hourly.parquet"
source             = "pvdaq_1231"
time_col           = "timestamp"
power_col          = "pv_power_hourly_kW"
power_unit         = "kW"
tz                 = "Etc/GMT+5"      # fixed standard time: pvdaq_extract.py moved the labels onto it, per month
timestamp_label    = "start"
interval_minutes   = 60
manual_shift_hours = 0
auto_lag_correction = false     # already corrected in the parquet (0 h in every year, pvdaq_verify_parquet.py)
max_lag_hours      = 4

[module]
# Uni_Solar_PVL_124__2006__E__ (3-a-Si); values from the SANDIA table
isc_ref    = 5.1000
voc_ref    = 42.0000
imp_ref    = 4.1000
vmp_ref    = 30.0000
mu_isc     = 0.005100   # A/K
mu_voc     = -0.160000   # V/K
ns         = 20
alpha_p    = -0.002100   # 1/K (Sandia Aimp + Bvmpo/Vmpo)
eta_mp_stc = 0.0623

[iam]
n = 1.526
k = 4.0
l = 0.002

[thermal.homer]
tc_noct   = 45.0      # Sandia has no NOCT: 45 assumed
ta_noct   = 20.0
poa_noct  = 0.8
tau_alpha = 0.9

[thermal.pvsyst]
u_c        = 15.0     # laminate bonded to the roof (PVsyst 'integrated'); mounting assumed from the system name and tilt
u_v        = 0.0
eta_module = 0.0623
alpha_abs  = 0.9

[losses]
n_degradation = 0.9855   # (1 - 0.005)^2.9 years: installed 2000-07-29 (earliest of metadata and first data), mid-2003
n_temp      = 0.95   # HOMER model only
n_soiling   = 0.98
n_mismatch  = 0.98
n_dc_wiring = 0.98
n_ac_wiring = 0.99
n_inverter  = 0.97
f_pv        = 0.95
eta_inv     = 0.97

# ── Provenance: source class of every model parameter (scripts/site_provenance.py) ──
# measured | datasheet | published | metadata | output | assumed (solarmodel/schema.py)
[provenance]
"location.lat"              = "metadata"
"location.lon"              = "metadata"
"location.altitude"         = "metadata"
"array.tracking"            = "metadata"
"array.tilt"                = "metadata"
"array.azimuth"             = "metadata"
"array.albedo"              = "assumed"
"system.rated_capacity_kw"  = "metadata"
"system.pdc0_w"             = "metadata"
"system.ns_arr"             = "assumed"
"system.np_arr"             = "assumed"
"module.isc_ref"            = "datasheet"
"module.voc_ref"            = "datasheet"
"module.imp_ref"            = "datasheet"
"module.vmp_ref"            = "datasheet"
"module.mu_isc"             = "datasheet"
"module.mu_voc"             = "datasheet"
"module.ns"                 = "datasheet"
"module.alpha_p"            = "datasheet"
"module.eta_mp_stc"         = "datasheet"
"iam.n"                     = "published"
"iam.k"                     = "published"
"iam.l"                     = "published"
"thermal.homer.tc_noct"     = "assumed"
"thermal.homer.ta_noct"     = "published"
"thermal.homer.poa_noct"    = "published"
"thermal.homer.tau_alpha"   = "published"
"thermal.pvsyst.u_c"        = "published"
"thermal.pvsyst.u_v"        = "published"
"thermal.pvsyst.eta_module" = "datasheet"
"thermal.pvsyst.alpha_abs"  = "published"
"losses.n_degradation"      = "published"
"losses.n_temp"             = "assumed"
"losses.n_soiling"          = "assumed"
"losses.n_mismatch"         = "assumed"
"losses.n_dc_wiring"        = "assumed"
"losses.n_ac_wiring"        = "assumed"
"losses.n_inverter"         = "assumed"
"losses.f_pv"               = "assumed"
"losses.eta_inv"            = "assumed"
