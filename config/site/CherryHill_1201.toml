# Site: PVDAQ System 1201 - [1201] Distributed Sun - 5 Executive Campus
# Dataset: PVDAQ (OEDI), system_id = 1201; written by scripts/pvdaq_site_configs.py, edit there
# Measured: data/validation/PVDAQ/1201/1201_hourly.parquet (pvdaq_extract.py; see 1201_report.md)
# DC rating 140.14 kW: module count x model-name wattage
# Module: metadata 'sw245 mono' (CEC SolarWorld_Industries_GmbH_Sunmodule_Plus_SW_245_mono)
# Inverter: Satcon PowerGate Plus 135 kW x 1, AC cap 135.0 kW
# Weather: NSRDB PSM v4 at the site; inputs "nsrdb", met "point"
# Scoring year 2012: most scorable daylight hours of the years the weather source covers (99.6 % of daylight hours)

[location]
name     = "PVDAQ 1201 - [1201] Distributed Sun - 5 Executive Campus"
lat      = 39.9283
lon      = -75.0481
altitude = 18.0        # m, metadata

[data]
start_date = "2012-01-01"
end_date   = "2012-12-31"
resolution = "hourly"
sa_start   = "2012-01-01"
sa_end     = "2012-12-31"

[array]
tracking = false
tilt     = 10.0        # metadata
azimuth  = 230.0       # metadata, degrees from north
albedo   = 0.20        # assumed

[system]
rated_capacity_kw = 140.14
pdc0_w            = 140140.0   # DC rating above (572 x 245.2 W = 140.24 kW from the module table)
ac_cap_kw         = 135.0       # inverter nameplate x count
ns_arr            = 13           # assumed (no string data; ~400 V target; only Ns x Np = 572 matters without an inverter model)
np_arr            = 44

[measured]
file               = "data/validation/PVDAQ/1201/1201_hourly.parquet"
source             = "pvdaq_1201"
time_col           = "timestamp"
power_col          = "pv_power_hourly_kW"
power_unit         = "kW"
tz                 = "Etc/GMT+5"      # fixed standard time: pvdaq_extract.py moved the labels onto it, per month
timestamp_label    = "start"
interval_minutes   = 60
manual_shift_hours = 0
auto_lag_correction = false     # already corrected in the parquet (0 h in every year, pvdaq_verify_parquet.py)
max_lag_hours      = 4

[module]
# SolarWorld_Industries_GmbH_Sunmodule_Plus_SW_245_mono (Mono-c-Si); values from the CEC table
isc_ref    = 8.2500
voc_ref    = 37.7000
imp_ref    = 7.9600
vmp_ref    = 30.8000
mu_isc     = 0.004703   # A/K
mu_voc     = -0.127803   # V/K
ns         = 60
alpha_p    = -0.004370   # 1/K
eta_mp_stc = 0.1459
cec        = "SolarWorld_Industries_GmbH_Sunmodule_Plus_SW_245_mono"

[iam]
n = 1.526
k = 4.0
l = 0.002

[thermal.homer]
tc_noct   = 47.4
ta_noct   = 20.0
poa_noct  = 0.8
tau_alpha = 0.9

[thermal.pvsyst]
u_c        = 20.0     # low-tilt rack on a roof (PVsyst 'semi-integrated with air duct'); mounting assumed from the system name and tilt
u_v        = 0.0
eta_module = 0.1459
alpha_abs  = 0.9

[snow]
removal = "fast"       # measured / snow-free output 0.76 in the hours the chain has the array
                       # snow-covered: snow is cleared faster than the NREL model slides it (FAST_SNOW)

[losses]
n_degradation = 0.9928   # (1 - 0.005)^1.4 years: installed 2011-01-24 (earliest of metadata and first data), mid-2012
n_temp      = 0.95   # HOMER model only
n_soiling   = 0.98
n_mismatch  = 0.98
n_dc_wiring = 0.98
n_ac_wiring = 0.99
n_inverter  = 0.97
f_pv        = 0.95
eta_inv     = 0.97

# ── Provenance: source class of every model parameter (scripts/site_provenance.py) ──
# measured | datasheet | published | metadata | output | assumed (solarmodel/schema.py)
[provenance]
"location.lat"              = "metadata"
"location.lon"              = "metadata"
"location.altitude"         = "metadata"
"array.tracking"            = "metadata"
"array.tilt"                = "metadata"
"array.azimuth"             = "metadata"
"array.albedo"              = "assumed"
"system.rated_capacity_kw"  = "metadata"
"system.pdc0_w"             = "metadata"
"system.ac_cap_kw"          = "metadata"
"system.ns_arr"             = "assumed"
"system.np_arr"             = "assumed"
"module.isc_ref"            = "datasheet"
"module.voc_ref"            = "datasheet"
"module.imp_ref"            = "datasheet"
"module.vmp_ref"            = "datasheet"
"module.mu_isc"             = "datasheet"
"module.mu_voc"             = "datasheet"
"module.ns"                 = "datasheet"
"module.alpha_p"            = "datasheet"
"module.eta_mp_stc"         = "datasheet"
"module.cec"                = "datasheet"
"iam.n"                     = "published"
"iam.k"                     = "published"
"iam.l"                     = "published"
"thermal.homer.tc_noct"     = "datasheet"
"thermal.homer.ta_noct"     = "published"
