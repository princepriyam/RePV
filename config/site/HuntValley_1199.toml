# Site: PVDAQ System 1199 - [1199] Distributed Sun - Hunt Valley
# Dataset: PVDAQ (OEDI), system_id = 1199; written by scripts/pvdaq_site_configs.py, edit there
# Measured: data/validation/PVDAQ/1199/1199_hourly.parquet (pvdaq_extract.py; see 1199_report.md)
# DC rating 52.92 kW: module count x model-name wattage
# Module: metadata 'Suntech 280W' only; STP280-24/Vd (72-cell, 2010) assumed (CEC Suntech_Power_STP280_24_Vd)
# Inverter: SMA SB7000US x 7, AC cap 49.0 kW
# Weather: NSRDB PSM v4 at the site; inputs "nsrdb", met "point"
# Scoring year 2018: most scorable daylight hours of the years the weather source covers (98.3 % of daylight hours)

[location]
name     = "PVDAQ 1199 - [1199] Distributed Sun - Hunt Valley"
lat      = 39.4856
lon      = -76.6636
altitude = 325.0        # m, metadata

[data]
start_date = "2018-01-01"
end_date   = "2018-12-31"
resolution = "hourly"
sa_start   = "2018-01-01"
sa_end     = "2018-12-31"

[array]
tracking = false
tilt     = 20.0        # metadata
azimuth  = 180.0       # metadata, degrees from north
albedo   = 0.20        # assumed

[system]
rated_capacity_kw = 52.92
pdc0_w            = 52920.0   # DC rating above (189 x 279.8 W = 52.89 kW from the module table)
ac_cap_kw         = 49.0       # inverter nameplate x count
ns_arr            = 9           # assumed (no string data; ~400 V target; only Ns x Np = 189 matters without an inverter model)
np_arr            = 21

[measured]
file               = "data/validation/PVDAQ/1199/1199_hourly.parquet"
source             = "pvdaq_1199"
time_col           = "timestamp"
power_col          = "pv_power_hourly_kW"
power_unit         = "kW"
tz                 = "Etc/GMT+5"      # fixed standard time: pvdaq_extract.py moved the labels onto it, per month
timestamp_label    = "start"
interval_minutes   = 60
manual_shift_hours = 0
auto_lag_correction = false     # already corrected in the parquet (0 h in every year, pvdaq_verify_parquet.py)
max_lag_hours      = 4

[module]
# Suntech_Power_STP280_24_Vd (Multi-c-Si); values from the CEC table
isc_ref    = 8.3300
voc_ref    = 44.8000
imp_ref    = 7.9500
vmp_ref    = 35.2000
mu_isc     = 0.004498   # A/K
mu_voc     = -0.140224   # V/K
ns         = 72
alpha_p    = -0.004150   # 1/K
eta_mp_stc = 0.1442
cec        = "Suntech_Power_STP280_24_Vd"

[iam]
n = 1.526
k = 4.0
l = 0.002

[thermal.homer]
tc_noct   = 46.1
ta_noct   = 20.0
poa_noct  = 0.8
tau_alpha = 0.9

[thermal.pvsyst]
u_c        = 20.0     # low-tilt rack on a roof (PVsyst 'semi-integrated with air duct'); mounting assumed from the system name and tilt
u_v        = 0.0
eta_module = 0.1442
alpha_abs  = 0.9

[losses]
n_degradation = 0.9602   # (1 - 0.005)^8.1 years: installed 2010-05-26 (earliest of metadata and first data), mid-2018
n_temp      = 0.95   # HOMER model only
n_soiling   = 0.98
n_mismatch  = 0.98
n_dc_wiring = 0.98
n_ac_wiring = 0.99
n_inverter  = 0.97
f_pv        = 0.95
eta_inv     = 0.97

# ── Provenance: source class of every model parameter (scripts/site_provenance.py) ──
# measured | datasheet | published | metadata | output | assumed (solarmodel/schema.py)
[provenance]
"location.lat"              = "metadata"
"location.lon"              = "metadata"
"location.altitude"         = "metadata"
"array.tracking"            = "metadata"
"array.tilt"                = "metadata"
"array.azimuth"             = "metadata"
"array.albedo"              = "assumed"
"system.rated_capacity_kw"  = "metadata"
"system.pdc0_w"             = "metadata"
"system.ac_cap_kw"          = "metadata"
"system.ns_arr"             = "assumed"
"system.np_arr"             = "assumed"
"module.isc_ref"            = "datasheet"
"module.voc_ref"            = "datasheet"
"module.imp_ref"            = "datasheet"
"module.vmp_ref"            = "datasheet"
"module.mu_isc"             = "datasheet"
"module.mu_voc"             = "datasheet"
"module.ns"                 = "datasheet"
"module.alpha_p"            = "datasheet"
"module.eta_mp_stc"         = "datasheet"
"module.cec"                = "datasheet"
"iam.n"                     = "published"
"iam.k"                     = "published"
"iam.l"                     = "published"
"thermal.homer.tc_noct"     = "datasheet"
"thermal.homer.ta_noct"     = "published"
